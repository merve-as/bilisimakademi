<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Akademi - Geleceğini İnşa Et{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Ön Yüz CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/front.css') }}">
</head>
<body>

    <!-- 1. ÜST MENÜ (NAVBAR) -->
    <nav class="front-navbar">
        <div class="container d-flex justify-content-between align-items-center">
            <!-- Sol: Logo -->
            <a href="{{ url_for('landing_page') }}" class="brand-logo">
                <i class="fa-solid fa-code"></i>
                YazılımAkademi
            </a>

            <!-- Sağ: Giriş Butonları -->
            <div class="nav-buttons">
               
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-primary btn-sm rounded-pill px-4 fw-semibold shadow-sm">
                    <i class="fa-solid fa-lock me-1"></i> Yönetici Girişi
                </a>
            </div>
        </div>
    </nav>

    <!-- 2. ANA İÇERİK BLOĞU (index.html buraya gelecek) -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- 3. FOOTER (ALT BİLGİ) -->
    <footer class="front-footer">
        <div class="container">
            <div class="mb-4">
                <i class="fa-solid fa-code fs-2 text-primary mb-3"></i>
                <h5 class="text-white fw-bold">YazılımAkademi Projesi</h5>
                <p class="small">Python, Flask, MS SQL Server, HTML, CSS ve JavaScript<br>ile geliştirilmiş tam kapsamlı eğitim projesi.</p>
            </div>
            <hr class="border-secondary opacity-25">
            <small>&copy; 2026 Tüm Hakları Saklıdır. Eğitim Amaçlıdır.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
